[package]
name = "systrayweather"
version = "0.3.2"
edition = "2021"
description = "Plasma and Windows system tray weather indicator"

[dependencies]
tray-icon = { version = "0.26", default-features = false }
iced = { version = "0.14", features = ["canvas", "tokio", "advanced"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
winreg = "0.52"
