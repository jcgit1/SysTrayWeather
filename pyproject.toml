[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systrayweather"
version = "0.1.0"
description = "KDE Plasma system tray weather indicator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "httpx>=0.27",
]

[project.scripts]
systrayweather = "systrayweather.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
systrayweather = ["../assets/*"]
